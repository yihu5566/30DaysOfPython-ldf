<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>30 Days of JavaScript</title>
    </head>
    <body>
        <div>
            <h1>30 Days of JavaScript</h1>
            <p>30DaysOfJavaScript: Day 5</p>
        </div>
        <script type="text/javascript">
            //数组
            const numbers = [0, 3.14, 9.81, 37, 98.6, 100] // array of numbers
            const emptyArray = [] // empty array of numbers
            console.log(numbers)
            const xArray = Array(4).fill('X') // creates an array with 4 elements and fills each element with 'X'
            console.log(xArray) // ['X', 'X', 'X', 'X']
            numbers.concat([100, 200]) // concatenates two arrays
            console.log(numbers) // [0, 3.14, 9.81, 37, 98.6, 100, 100, 200]
            //判断数组是否存在
            console.log(numbers.includes(100)) // true
            console.log(numbers.includes(1000)) // false
            console.log(numbers.indexOf(9.81)) // 2
            console.log(numbers.lastIndexOf(100)) // 5
            const number = 4
            console.log(Array.isArray(number)) // false
            console.log(Array.isArray(numbers)) // true
            //数组转换为字符串
            console.log(numbers.toString()) // 0,3.14,9.81,37,98.6,100
            console.log(numbers.join('-')) // 0-3.14-9.81-37-98.6-100
            //数组切片
            console.log(numbers.slice(1, 4)) // [3.14, 9.81, 37]
            console.log(numbers.slice(0, numbers.length)) // [0, 3.14, 9.81, 37, 98.6, 100]
            console.log(numbers.slice()) // [0, 3.14, 9.81, 37, 98.6, 100]
            //数组拼接
            console.log(numbers.splice(0, 1)) // [0]
            console.log(numbers) // [3.14, 9.81, 37, 98.6, 100]
            //push and pop
            numbers.push(200) // add 200 to the end of the array
            console.log(numbers) // [3.14, 9.81, 37, 98.6, 100, 200]
            numbers.pop() // remove one element from the end of the array
            console.log(numbers) // [3.14, 9.81, 37, 98.6, 100]
            //shift and unshift
            numbers.shift() // remove one element from the beginning of the array
            console.log(numbers) // [9.81, 37, 98.6, 100]
            numbers.unshift(0) // add 0 to the beginning of the array
            console.log(numbers) // [0, 9.81, 37, 98.6, 100]
            //reverse
            numbers.reverse() // reverse the array
            console.log(numbers) // [100, 98.6, 37, 9.81, 0]
            //sort
            numbers.sort() // sort the array
            console.log(numbers) // [0, 100, 37, 9.81, 98.6]
            //数组的数组
            const frontEnd = ['HTML', 'CSS', 'JS', 'React', 'Redux']
            const backEnd = ['Node', 'Express', 'MongoDB']
            const fullStack = [frontEnd, backEnd] // array of arrays, containing two arrays
            console.log(fullStack) // [['HTML', 'CSS', 'JS', 'React', 'Redux'], ['Node', 'Express', 'MongoDB']]
            console.log(fullStack.length) // 2
        </script>
    </body>
